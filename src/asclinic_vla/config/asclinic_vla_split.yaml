# Split cloud/Jetson runtime configuration.
# This launch mode sends camera + instruction to Zenoh, receives action-head
# pose chunks from Zenoh, then uses odometry feedback, wheel PID, and Roboclaw
# locally.

goal_publisher:
  ros__parameters:
    goal_topic: /asyncvla/goal
    mode: text
    goal_text: ""
    image_path: ""
    publish_period_sec: 1.0
    publish_once: true

asclinic_camera_capture:
  ros__parameters:
    camera_device: 0
    frame_width: 640
    frame_height: 480
    fps: 10.0
    image_topic: /cam
    show_preview: false

zenoh_camera_bridge:
  ros__parameters:
    image_topic: /cam
    # Must match run_vla.py and split_action_head_runner.py subscriptions.
    zenoh_camera_key: camera/img_compressed
    # Override this from launch with zenoh_connect_endpoint:=tcp/CLOUD_IP:7447.
    zenoh_connect_endpoints:
      - tcp/127.0.0.1:7447
    zenoh_listen_endpoints: []
    jpeg_quality: 80
    publish_rate_hz: 5.0

zenoh_instruction_bridge:
  ros__parameters:
    goal_topic: /asyncvla/goal
    # Single GoalSpec-compatible JSON payload for text or image goals.
    zenoh_goal_key: robot/goal
    zenoh_connect_endpoints:
      - tcp/127.0.0.1:7447
    zenoh_listen_endpoints: []
    republish_duplicates: false
    image_goal_fallback_text: navigate to the goal image
    jpeg_quality: 90

zenoh_action_chunk_bridge:
  ros__parameters:
    action_topic: /asyncvla/action_chunk
    # Must match split_action_head_runner.py publisher.
    zenoh_action_chunk_key: vla/action_chunk
    zenoh_connect_endpoints:
      - tcp/127.0.0.1:7447
    zenoh_listen_endpoints: []

encoder_odometry:
  ros__parameters:
    encoder_counts_topic: encoder_counts
    odom_topic: odom
    pose2d_topic: odom_pose2d
    wheel_base: 0.22
    wheel_radius: 0.072
    encoder_counts_per_rev: 4480
    odom_frame_id: odom
    base_frame_id: base_link

odom_action_chunk_tracker:
  ros__parameters:
    action_topic: /asyncvla/action_chunk
    pose2d_topic: odom_pose2d
    wheel_reference_topic: wheel_velocity_reference
    wheel_base: 0.22
    lookahead_distance: 0.35
    max_linear_speed: 0.30
    max_angular_speed: 1.20
    command_timeout_sec: 0.75
    control_rate_hz: 10.0
    k_cross_track: 1.6
    k_heading: 1.0
    goal_tolerance: 0.05

wheel_pid_controller:
  ros__parameters:
    # Consumes wheel references from odom_action_chunk_tracker and encoder
    # deltas from roboclaw_for_motors, then publishes duty-cycle commands.
    wheel_reference_topic: wheel_velocity_reference
    encoder_counts_topic: encoder_counts
    duty_cycle_topic: set_motor_duty_cycle
    control_period_sec: 0.1
    wheel_radius: 0.072
    encoder_counts_per_rev: 4480
    kp_left: 10.0
    ki_left: 5.0
    kd_left: 2.0
    kp_right: 10.0
    ki_right: 5.0
    kd_right: 2.0
    ref_timeout_sec: 0.5
    wheel_speed_filter_alpha: 0.5
    motor_filter_alpha: 0.6

roboclaw_for_motors:
  ros__parameters:
    # Set dry_run true while testing the VLA/Zenoh/control chain without motors.
    duty_cycle_topic: set_motor_duty_cycle
    current_duty_cycle_topic: current_motor_duty_cycle
    encoder_counts_topic: encoder_counts
    roboclaw_usb_port: /dev/ttyACM0
    roboclaw_baudrate: 38400
    roboclaw_address: 128
    encoder_period_sec: 0.1
    max_duty_cycle: 100.0
    left_motor_multiplier: -1.0
    right_motor_multiplier: 1.0
    dry_run: false
