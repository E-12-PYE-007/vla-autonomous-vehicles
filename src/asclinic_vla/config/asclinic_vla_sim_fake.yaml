fake_action_chunk_publisher:
  ros__parameters:
    action_topic: /asyncvla/action_chunk
    publish_rate_hz: 2.0
    chunk_length: 8
    step_distance: 0.12
    turn_per_step: 0.08
    pattern: straight

odom_to_pose2d:
  ros__parameters:
    odom_topic: /odom
    pose2d_topic: odom_pose2d

odom_action_chunk_tracker:
  ros__parameters:
    action_topic: /asyncvla/action_chunk
    pose2d_topic: odom_pose2d
    wheel_reference_topic: wheel_velocity_reference
    wheel_base: 0.22
    lookahead_distance: 0.30
    max_linear_speed: 0.30
    max_angular_speed: 1.20
    command_timeout_sec: 1.0
    control_rate_hz: 20.0
    k_cross_track: 1.6
    k_heading: 1.0
    goal_tolerance: 0.05

wheel_reference_to_cmd_vel:
  ros__parameters:
    wheel_reference_topic: wheel_velocity_reference
    cmd_vel_topic: /cmd_vel
    wheel_base: 0.22
